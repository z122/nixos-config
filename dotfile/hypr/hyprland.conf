# 忽略的行，表示这是一个自动生成的警告信息
#autogenerated = 1 # remove this line to remove the warning

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=,preferred,auto,auto # 配置监视器，使用首选分辨率和自动位置，缩放比例为auto

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# 在启动时执行的命令，这里使用的是fish shell来运行autostart脚本
# exec-once = fish -c autostart #TODO

# 引入另一个配置文件，实现多文件配置
source = ~/.config/hypr/macchiato.conf

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
# 输入设置，包括键盘布局、触摸板设置等
input {
    kb_layout = us  # 键盘布局
    kb_variant =  # 键盘变体
    kb_model =  # 键盘型号
    kb_options = grp:alt_shift_toggle  # 键盘选项，这里设置为Alt+Shift切换键盘布局
    follow_mouse = 1  # 鼠标跟随设置，1表示鼠标移动时改变焦点
    # touchpad {
    #     natural_scroll = yes  # 触摸板自然滚动
    #     tap-and-drag = true  # 触摸板点击并拖动
    # }
    sensitivity = 0  # 鼠标灵敏度，(-1.0 - 1.0) 0表示不修改
}


# xwayland {
#     force_zero_scaling = true #禁用XWayland缩放
# }

# 环境变量设置，影响Hyprland和其他应用程序
env = HYPRCURSOR_THEME,Catppuccin-Macchiato-Teal  # 设置光标主题
env = HYPRCURSOR_SIZE,24  # 设置光标大小
env = XCURSOR_THEME,Catppuccin-Macchiato-Teal  # 设置X11光标主题
env = XCURSOR_SIZE,24  # 设置X11光标大小

# 常规设置，包括窗口间隙、边框大小、活动窗口边框颜色等
general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    gaps_in = 5  # 窗口内间隙
    gaps_out = 10  # 窗口与屏幕边缘间隙
    border_size = 2  # 边框大小
    col.active_border = $teal  # 活动窗口边框颜色
    col.inactive_border = $surface1  # 非活动窗口边框颜色
    layout = dwindle  # 使用Dwindle布局，master布局可选
}

# 窗口装饰设置，包括圆角、模糊效果、阴影等
decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    rounding = 10  # 窗口圆角大小
    blur {
        size = 8  # 模糊大小
        passes = 2  # 模糊遍历次数
    }
    drop_shadow = yes  # 开启窗口阴影效果
    shadow_range = 15  # 阴影范围
    shadow_offset = 0, 0 # 阴影偏移
    shadow_render_power = 3 # 阴影渲染强度
    col.shadow = $teal  # 窗口阴影颜色
    col.shadow_inactive = 0xff$baseAlpha;  # 非活动窗口阴影颜色
    # 窗口透明度设置
    active_opacity = 0.7
    inactive_opacity = 0.7
    fullscreen_opacity = 0.7
}

# 动画设置，包括启用动画、贝塞尔曲线定义、窗口动画等
animations {
    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    enabled = yes  # 启用动画
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05  # 自定义贝塞尔曲线
    animation = windows, 1, 2, myBezier  # 窗口动画设置
    animation = windowsOut, 1, 2, default, popin 80% # 窗口关闭动画设置
    animation = border, 1, 3, default # 边框动画设置
    animation = fade, 1, 2, default # 淡入淡出动画设置
    animation = workspaces, 1, 1, default # 工作区动画设置
}

# Dwindle布局设置，包括伪平铺、永久分割等
dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes  # 开启伪平铺, 使用mainMod + P 切换 在后面的绑定设置
    preserve_split = yes  # 保持分割状态
    smart_split = true;  # 根据鼠标位置智能分割
}

# 主布局设置，这里设置新窗口默认为master
master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
    new_status = master
}

# 触摸板手势设置
# gestures {
      # See https://wiki.hyprland.org/Configuring/Variables/ for more
#     workspace_swipe = on  # 开启工作区滑动手势
# }

# 杂项设置，包括是否显示Hyprland logo、背景颜色等
misc {
    disable_hyprland_logo = true  # 隐藏Hyprland logo
    disable_splash_rendering = true  # 隐藏启动画面
    background_color = 0x24273a  # 背景颜色
}

# 绑定设置，包括工作区切换、窗口操作等
binds {
    workspace_back_and_forth = true  # If enabled, an attempt to switch to the currently focused workspace will instead switch to the previous workspace.
}

# 特定设备配置示例，这里设置了一个鼠标的灵敏度
# see https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs
device {
    # name = epic mouse V1  # 设备名称 The name can be easily obtained by doing `hyprctl devices`.
    # sensitivity = -0.5  # 设备灵敏度
}

# 窗口规则设置，包括浮动窗口、透明度等
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# windowrule = float, ^(kitty)$ # 浮动kitty窗口
windowrule = float, imv # 浮动imv窗口
windowrule = opaque, imv # 不透明imv窗口
windowrule = float, title:(Media viewer) # 浮动标题为Media viewer的窗口
windowrule = opaque, title:(Media viewer) # 不透明标题为Media viewer的窗口
windowrule = opaque, title:(YouTube Music) # 不透明标题为YouTube Music的窗口
windowrule = opaque, telegram # 不透明telegram窗口
windowrule = float, mpv # 浮动mpv窗口
windowrule = opaque, mpv # 不透明mpv窗口
windowrule = opaque, swappy # 不透明swappy窗口
windowrule = center 1, swappy # 居中swappy窗口
windowrule = stayfocused, swappy # 保持swappy窗口焦点


# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# 主要的修饰键设置
$mainMod = SUPER

# will switch to a submap called resize
bind=ALT,R,submap,resize
# will start a submap called "resize"
submap=resize
    # sets repeatable binds for resizing the active window
    binde=,l,resizeactive,10 0
    binde=,h,resizeactive,-10 0
    binde=,k,resizeactive,0 -10
    binde=,j,resizeactive,0 10
    # use reset to go back to the global submap
    bind=,escape,submap,reset
# will reset the submap, meaning end the current one and return to the global one
submap=reset

# will switch to a submap called move
bind=ALT,M,submap,move
# will start a submap called "move"
submap=move
    # sets repeatable binds for moving the active window
    bind=,l,movewindow,r
    bind=,h,movewindow,l
    bind=,k,movewindow,u
    bind=,j,movewindow,d
    # use reset to go back to the global submap
    bind=,escape,submap,reset
# will reset the submap, meaning end the current one and return to the global one
submap=reset

# keybinds further down will be global again...

